name: Build & Publish Windows .EXE to GitHub Releases

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows-exe:
    name: Build Windows x64 .EXE & Publish to Releases Tab
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Electron & Builder Dependencies
        working-directory: electron-desktop
        run: npm install --no-audit --no-fund

      - name: 4. Build Windows x64 NSIS Setup & Portable .EXE
        working-directory: electron-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const slug=process.env.GITHUB_REPOSITORY_SLUG||'thakorvijay51098/Viju-Browser';const parts=slug.split('/');const owner=parts[0]||'thakorvijay51098';const repo=parts[1]||'Viju-Browser';p.repository={type:'git',url:'https://github.com/'+owner+'/'+repo+'.git'};p.build=p.build||{};p.build.publish=[{provider:'github',owner:owner,repo:repo,releaseType:'release',channel:'latest'}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          npx electron-builder --win --x64 --publish never

      - name: 5. Upload .EXE Build Artifacts to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: Viju-Browser-Windows-x64-EXE
          path: |
            electron-desktop/dist-installer/*.exe
          if-no-files-found: error

      - name: 6. Publish Direct .EXE Files to GitHub Releases Tab
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "Viju Browser v1.4.0 — Windows 64-Bit (.EXE Direct Download)"
          body: |
            ## Viju Browser v1.4.0 (Windows 10 / 11 x64)
            Security-hardened custom Chromium + Electron desktop browser with all privacy protections ON by default:
            - **WebRTC Shield:** All 7 controls ON (`Enable WebRTC Shield`, `Block Local IP`, `Block Public IP`, `Block UDP`, `Force Proxy`, `Leak Detection`, `Whitelist`).
            - **Maximum 12-Surface Fingerprint Spoofing:** Canvas, WebGL, Audio, Font, ClientRects, WebRTC, Navigator, Timezone, Random, No-Cache, Whitelist, Logs — all ON by default.
            - **Random User-Agent Switcher:** Global switcher, auto-rotation, startup rotation, and JS `navigator` protection ON.
            - **Clear Browsing Data:** All 9 Web Data + 4 Browser Data checkboxes checked by default.
            - **Auto Refresh Plus:** Multi-tab independent timers (minimum 5s).

            ### Direct Windows `.EXE` Downloads (Below in Assets)
            1. **`Viju-Browser-Setup-1.4.0-x64.exe`** — Full Windows NSIS Installer (creates Desktop & Start Menu shortcuts).
            2. **`Viju-Browser-Portable-1.4.0-x64.exe`** — Standalone Portable `.EXE` (run directly without installation).
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            electron-desktop/dist-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
