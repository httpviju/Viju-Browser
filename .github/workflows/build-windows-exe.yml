name: Build & Publish Windows .EXE to GitHub Releases

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows-exe:
    name: Build Windows x64 .EXE & Publish to Releases Tab
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Electron & Builder Dependencies
        working-directory: electron-desktop
        run: npm install --no-audit --no-fund

      - name: 4. Build Windows x64 NSIS Setup & Portable .EXE
        working-directory: electron-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const slug=process.env.GITHUB_REPOSITORY_SLUG||'thakorvijay51098/Viju-Browser';const parts=slug.split('/');const owner=parts[0]||'thakorvijay51098';const repo=parts[1]||'Viju-Browser';p.repository={type:'git',url:'https://github.com/'+owner+'/'+repo+'.git'};p.build=p.build||{};p.build.publish=[{provider:'github',owner:owner,repo:repo,releaseType:'release',channel:'latest'}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          npx electron-builder --win --x64 --publish never

      - name: 5. Upload .EXE Build Artifacts to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: Viju-Browser-Windows-x64-EXE
          path: |
            electron-desktop/dist-installer/*.exe
          if-no-files-found: error

      - name: 6. Publish Direct .EXE Files to GitHub Releases Tab
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.4.0 "${{ github.sha }}"
          git push origin v1.4.0 --force
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 electron-desktop/dist-installer/*.exe --clobber
          else
            gh release create v1.4.0 electron-desktop/dist-installer/*.exe \
              --target "${{ github.sha }}" \
              --title "Viju Browser v1.4.0 — Windows 64-Bit (.EXE Direct Download)" \
              --notes "Direct Windows 64-bit NSIS Installer (Viju-Browser-Setup-1.4.0-x64.exe) and Standalone Portable Executable (Viju-Browser-Portable-1.4.0-x64.exe) with WebRTC Shield, 12-Surface Fingerprint Spoofing, and Random User-Agent Switcher ON by default." \
              --latest
          fi

